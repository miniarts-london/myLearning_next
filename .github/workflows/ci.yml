name: CI

# When to run: every push to main, and every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1. Fast checks: lint and TypeScript
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # get the code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                       # reuse downloaded packages between runs
      - run: npm ci                        # clean install from package-lock.json
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit               # React Testing Library (Vitest), a few seconds

  # 2. The Python AI service's tests
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  # 3. End-to-end tests: real browser, mock Moodle and mock AI service
  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-types                  # only if the fast checks passed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e              # builds the app and starts the mocks itself
      - uses: actions/upload-artifact@v4   # keep the HTML report if something fails
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7